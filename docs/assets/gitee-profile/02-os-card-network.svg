      <path d="M146 142 91 218"/><path d="M146 142 203 224"/><path d="M146 142 136 35"/>
    </g>
    <g fill="#6f6f6f">
      <circle cx="93" cy="75" r="9"/><circle cx="204" cy="66" r="9"/><circle cx="250" cy="139" r="9"/>
      <circle cx="91" cy="218" r="9"/><circle cx="203" cy="224" r="9"/><circle cx="136" cy="35" r="9"/>
      <circle cx="116" cy="104" r="6"/><circle cx="187" cy="110" r="6"/><circle cx="175" cy="180" r="6"/>
    </g>
    <g transform="translate(0 270)" filter="url(#shadow)">
      <rect width="292" height="108" rx="26" fill="#fff" opacity=".94"/>
      <text x="146" y="40" fill="#0f1f33" text-anchor="middle" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="800">个人词汇网络 OS</text>
      <text x="146" y="71" fill="#52637a" text-anchor="middle" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="17">按场景学习 · 按关系理解</text>
      <text x="146" y="95" fill="#52637a" text-anchor="middle" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="17">按算法复习 · 持续演进</text>
    </g>
  </g>
  <g transform="translate(136 456)">
    <rect width="690" height="50" rx="25" fill="#fff" opacity=".9"/>
    <text x="42" y="33" fill="#52637a" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">公式：通用 OS + 标准词卡包 + 个人目标 = 个人词汇网络</text>
  </g>
</svg>
