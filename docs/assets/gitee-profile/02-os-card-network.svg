<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">词境 OS 与个人词汇网络的关系</title>
  <desc id="desc">通用词境 OS、个人场景目标、标准词卡包组合生成个人词汇网络操作系统。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f1f33" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#d11b3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="36" fill="#eef3f8"/>
  <g transform="translate(70 62)">
    <text x="0" y="0" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="40" font-weight="800">从通用底座到个人词汇网络</text>
    <text x="0" y="46" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="21">OS 提供学习运行时，词卡包提供场景内容，用户目标决定个人路径。</text>
  </g>
  <g transform="translate(72 160)" filter="url(#shadow)">
    <rect width="290" height="248" rx="28" fill="#fff"/>
    <text x="32" y="52" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800">雅努斯词境 OS</text>
    <text x="32" y="92" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">通用学习运行时</text>
    <g transform="translate(32 122)">
      <rect width="92" height="36" rx="18" fill="#fff1f4"/>
      <text x="18" y="24" fill="#d11b3d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">复习</text>
      <rect x="108" width="92" height="36" rx="18" fill="#f6f8fb"/>
      <text x="126" y="24" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">图谱</text>
      <rect y="52" width="92" height="36" rx="18" fill="#f6f8fb"/>
      <text x="18" y="76" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">统计</text>
      <rect x="108" y="52" width="92" height="36" rx="18" fill="#f6f8fb"/>
      <text x="126" y="76" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">备份</text>
    </g>
  </g>
  <path d="M390 284h116" stroke="#d11b3d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(512 160)" filter="url(#shadow)">
    <rect width="290" height="248" rx="28" fill="#fff"/>
    <text x="32" y="52" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800">个人场景词卡包</text>
    <text x="32" y="92" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">按真实目标加工内容</text>
    <g transform="translate(32 122)" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">
      <rect width="98" height="34" rx="17" fill="#fff1f4"/>
      <text x="20" y="23" fill="#d11b3d">技术英语</text>
      <rect x="112" width="98" height="34" rx="17" fill="#f6f8fb"/>
      <text x="132" y="23" fill="#64748b">高中英语</text>
      <rect y="50" width="98" height="34" rx="17" fill="#f6f8fb"/>
      <text x="20" y="73" fill="#64748b">考试词汇</text>
      <rect x="112" y="50" width="98" height="34" rx="17" fill="#f6f8fb"/>
      <text x="132" y="73" fill="#64748b">职场英语</text>
    </g>
  </g>
  <path d="M830 284h86" stroke="#d11b3d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(912 134)">
    <circle cx="122" cy="150" r="118" fill="#fff" filter="url(#shadow)"/>
    <circle cx="122" cy="150" r="20" fill="#d11b3d"/>
    <g stroke="#d11b3d" stroke-width="3" opacity=".78">
      <path d="M122 150 69 83"/><path d="M122 150 180 74"/><path d="M122 150 226 147"/>
      <path d="M122 150 67 226"/><path d="M122 150 179 232"/><path d="M122 150 112 43"/>
    </g>
    <g fill="#6f6f6f">
      <circle cx="69" cy="83" r="9"/><circle cx="180" cy="74" r="9"/><circle cx="226" cy="147" r="9"/>
      <circle cx="67" cy="226" r="9"/><circle cx="179" cy="232" r="9"/><circle cx="112" cy="43" r="9"/>
      <circle cx="92" cy="112" r="6"/><circle cx="163" cy="118" r="6"/><circle cx="151" cy="188" r="6"/>
    </g>
    <text x="20" y="318" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800">个人词汇网络操作系统</text>
    <text x="34" y="354" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">按场景学习，按关系理解，按算法复习</text>
  </g>
  <g transform="translate(144 466)">
    <rect width="912" height="50" rx="25" fill="#fff" opacity=".86"/>
    <text x="44" y="33" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">公式：通用 OS + 标准词卡包 + 个人目标 = 可持续演进的个人词汇网络</text>
  </g>
</svg>
