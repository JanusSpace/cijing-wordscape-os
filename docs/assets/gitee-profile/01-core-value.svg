<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">雅努斯词境 OS 核心价值</title>
  <desc id="desc">本地优先、FSRS 记忆、关系图谱、社区词卡四个核心价值组合成个人词汇学习运行系统。</desc>
  <defs>
    <linearGradient id="soft" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7f9"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f1f33" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#soft)"/>
  <circle cx="1040" cy="82" r="130" fill="#fff" opacity=".58"/>
  <circle cx="135" cy="435" r="160" fill="#fff" opacity=".56"/>
  <g transform="translate(80 66)">
    <text x="0" y="0" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800">雅努斯词境 OS</text>
    <text x="0" y="48" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="22">把词卡、记忆、关系和场景组合成个人词汇网络</text>
  </g>
  <g transform="translate(80 178)" filter="url(#shadow)">
    <rect width="236" height="220" rx="26" fill="#fff"/>
    <circle cx="58" cy="62" r="28" fill="#fff1f4"/>
    <path d="M45 62h26M58 49v26" stroke="#d11b3d" stroke-width="7" stroke-linecap="round"/>
    <text x="34" y="126" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800">本地优先</text>
    <text x="34" y="164" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">数据存放在浏览器</text>
    <text x="34" y="194" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">可导出备份迁移</text>
  </g>
  <g transform="translate(344 178)" filter="url(#shadow)">
    <rect width="236" height="220" rx="26" fill="#fff"/>
    <circle cx="58" cy="62" r="28" fill="#fff1f4"/>
    <path d="M45 69c18-30 34-30 52 0" fill="none" stroke="#d11b3d" stroke-width="7" stroke-linecap="round"/>
    <path d="M52 68l-9 0 0-9" fill="none" stroke="#d11b3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="126" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800">FSRS 复习</text>
    <text x="34" y="164" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">正式评分驱动间隔</text>
    <text x="34" y="194" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">少时间记更多词</text>
  </g>
  <g transform="translate(608 178)" filter="url(#shadow)">
    <rect width="236" height="220" rx="26" fill="#fff"/>
    <circle cx="58" cy="62" r="28" fill="#fff1f4"/>
    <circle cx="46" cy="72" r="7" fill="#d11b3d"/>
    <circle cx="72" cy="46" r="7" fill="#d11b3d"/>
    <circle cx="82" cy="80" r="7" fill="#d11b3d"/>
    <path d="M46 72 72 46 82 80 46 72" fill="none" stroke="#d11b3d" stroke-width="5"/>
    <text x="34" y="126" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="800">关系图谱</text>
    <text x="34" y="164" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">看见场景与词族</text>
    <text x="34" y="194" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">定位为什么记不住</text>
  </g>
  <g transform="translate(872 178)" filter="url(#shadow)">
