<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">五个基础页面</title>
  <desc id="desc">今日、单词本、统计、图谱、设置五个基础页面组成雅努斯词境 OS 的核心使用闭环。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f1f33" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="#f7f9fc"/>
  <text x="70" y="82" fill="#0f1f33" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="40" font-weight="800">五个页面，一条学习闭环</text>
  <text x="70" y="126" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="21">从导入、学习、复习、分析到图谱诊断，保持极简但完整。</text>
  <g transform="translate(58 188)" filter="url(#shadow)" font-family="Inter, 'Microsoft YaHei', sans-serif">
    <g>
      <rect width="208" height="220" rx="28" fill="#fff"/>
      <circle cx="48" cy="54" r="25" fill="#fff1f4"/>
      <path d="M37 53h22M40 42v24M59 42v24" stroke="#d11b3d" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="118" fill="#0f1f33" font-size="27" font-weight="800">今日</text>
      <text x="30" y="157" fill="#64748b" font-size="17">只处理到期词卡</text>
      <text x="30" y="188" fill="#64748b" font-size="17">完成正式复习</text>
    </g>
    <g transform="translate(232 0)">
      <rect width="208" height="220" rx="28" fill="#fff"/>
      <circle cx="48" cy="54" r="25" fill="#fff1f4"/>
      <path d="M34 45h30c9 0 14 5 14 14v21H48c-8 0-14-5-14-14V45z" fill="none" stroke="#d11b3d" stroke-width="5" stroke-linejoin="round"/>
      <text x="30" y="118" fill="#0f1f33" font-size="27" font-weight="800">单词本</text>
      <text x="30" y="157" fill="#64748b" font-size="17">按二级场景组织</text>
      <text x="30" y="188" fill="#64748b" font-size="17">学习或浏览词卡</text>
    </g>
    <g transform="translate(464 0)">
      <rect width="208" height="220" rx="28" fill="#fff"/>
      <circle cx="48" cy="54" r="25" fill="#fff1f4"/>
      <path d="M36 75V42M51 75V55M66 75V34" stroke="#d11b3d" stroke-width="6" stroke-linecap="round"/>
      <text x="30" y="118" fill="#0f1f33" font-size="27" font-weight="800">统计</text>
      <text x="30" y="157" fill="#64748b" font-size="17">看执行与健康</text>
      <text x="30" y="188" fill="#64748b" font-size="17">发现薄弱场景</text>
    </g>
    <g transform="translate(696 0)">
      <rect width="208" height="220" rx="28" fill="#fff"/>
      <circle cx="48" cy="54" r="25" fill="#fff1f4"/>
      <circle cx="38" cy="70" r="5" fill="#d11b3d"/><circle cx="55" cy="42" r="5" fill="#d11b3d"/><circle cx="72" cy="66" r="5" fill="#d11b3d"/>
      <path d="M38 70 55 42 72 66" fill="none" stroke="#d11b3d" stroke-width="4"/>
      <text x="30" y="118" fill="#0f1f33" font-size="27" font-weight="800">图谱</text>
      <text x="30" y="157" fill="#64748b" font-size="17">看关系与来源</text>
      <text x="30" y="188" fill="#64748b" font-size="17">诊断记不住原因</text>
    </g>
    <g transform="translate(928 0)">
      <rect width="208" height="220" rx="28" fill="#fff"/>
      <circle cx="48" cy="54" r="25" fill="#fff1f4"/>
      <path d="M36 44h34M36 64h34M48 38v12M58 58v12" stroke="#d11b3d" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="118" fill="#0f1f33" font-size="27" font-weight="800">设置</text>
      <text x="30" y="157" fill="#64748b" font-size="17">导入与备份</text>
      <text x="30" y="188" fill="#64748b" font-size="17">规则与说明</text>
