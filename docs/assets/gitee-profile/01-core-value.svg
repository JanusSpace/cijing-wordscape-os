    <text x="34" y="164" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">标准字段可审计</text>
    <text x="34" y="194" fill="#64748b" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">共建共享可复用</text>
  </g>
  <path d="M112 447c270-25 479-26 704-5 80 8 162 10 254-9" fill="none" stroke="#d11b3d" stroke-width="5" stroke-linecap="round" opacity=".28"/>
